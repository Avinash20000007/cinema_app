<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2026 Tamil Cinema Ticket Booking MVP - BookMyShow Clone</title>
  <style>
    :root {
      --bg-dark: #020617;
      --card-bg: #0f172a;
      --card-hover: #1e293b;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --rose: #e11d48;
      --rose-hover: #f43f5e;
      --amber: #f59e0b;
      --emerald: #059669;
      --emerald-light: #10b981;
      --occupied-bg: #1e293b;
      --occupied-text: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 120px;
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--rose), var(--amber));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: white;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* MOVIE CATALOG GRID */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }

    .movie-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      border-color: #334155;
      background-color: var(--card-hover);
    }

    .movie-card.active {
      border-color: var(--rose);
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.3);
      background-color: #111827;
    }

    .poster-wrapper {
      height: 320px;
      width: 100%;
      background-color: #1e293b;
      position: relative;
      overflow: hidden;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rate-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 800;
      color: var(--amber);
    }

    .movie-info {
      padding: 16px;
    }

    .movie-info h3 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .movie-info p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: #64748b;
    }

    /* AUDITORIUM SEAT SELECTION */
    .auditorium-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .auditorium-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 24px;
      gap: 16px;
    }

    .legend {
      display: flex;
      gap: 18px;
      font-size: 12px;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .rows-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 0;
    }

    .row-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .row-label {
      width: 20px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
    }

    .seats-group {
      display: flex;
      gap: 8px;
    }

    .seat-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px 8px 2px 2px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #0f172a;
      user-select: none;
      outline: none;
    }

    .seat-btn:hover:not(:disabled) {
      background-color: var(--rose);
      color: #ffffff;
      border-color: var(--rose);
      transform: translateY(-2px);
    }

    .seat-btn.selected {
      background-color: var(--emerald) !important;
      color: #ffffff !important;
      border-color: var(--emerald-light) !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      transform: scale(1.05);
    }

    .seat-btn.occupied {
      background-color: var(--occupied-bg) !important;
      color: var(--occupied-text) !important;
      border-color: #334155 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .screen-container {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen-arc {
      width: 65%;
      height: 10px;
      background: linear-gradient(90deg, transparent, #22d3ee, transparent);
      border-radius: 100px 100px 0 0;
      box-shadow: 0 -10px 20px rgba(34, 211, 238, 0.4);
    }

    .screen-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      margin-top: 10px;
      font-weight: 700;
    }

    /* DYNAMIC CHECKOUT STICKY BAR */
    .checkout-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      padding: 16px 24px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
      z-index: 99;
    }

    .selected-summary {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .seat-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .seat-tag {
      background: rgba(5, 150, 105, 0.2);
      border: 1px solid var(--emerald);
      color: #6ee7b7;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .checkout-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .total-box {
      text-align: right;
    }

    .total-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .total-value {
      font-size: 26px;
      font-weight: 900;
      color: white;
    }

    .confirm-btn {
      background: linear-gradient(135deg, var(--rose), var(--amber));
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
    }

    .confirm-btn:hover:not(:disabled) {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    .confirm-btn:disabled {
      background: #334155;
      cursor: not-allowed;
      box-shadow: none;
      color: #94a3b8;
    }

    .status-alert {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .status-alert.success {
      background: rgba(5, 150, 105, 0.2);
      border: 1px solid var(--emerald);
      color: #6ee7b7;
      display: block;
    }

    .status-alert.error {
      background: rgba(225, 29, 72, 0.2);
      border: 1px solid var(--rose);
      color: #fda4af;
      display: block;
    }
  </style>
</head>
<body>

  <!-- TOP BRAND HEADER -->
  <header>
    <div class="brand">
      <div class="brand-logo">TN</div>
      <div class="brand-text">
        <h1>TAMIL CINEMA 2026</h1>
        <p>BookMyShow MVP • PostgreSQL Concurrency Protected</p>
      </div>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #94a3b8; background: #1e293b; padding: 6px 14px; border-radius: 100px; border: 1px solid #334155;">
      🟢 Chennai, Tamil Nadu
    </div>
  </header>

  <div class="container">
    <!-- MOVIE CATALOG (STEP 1) -->
    <div class="section-title">
      <span>1. Select Movie — Latest 2026 Tamil Blockbusters</span>
      <span style="font-size: 12px; color: #64748b; font-weight: 600;">4 MOVIES SHOWING TODAY</span>
    </div>

    <div id="movies-grid" class="movies-grid"></div>

    <!-- AUDITORIUM SEAT SELECTION (STEP 2) -->
    <div id="auditorium-box" class="auditorium-box">
      <div class="auditorium-header">
        <div>
          <span style="font-size: 11px; font-weight: 800; color: var(--rose); text-transform: uppercase; letter-spacing: 0.1em;">Step 2 — Auditorium Layout</span>
          <h2 id="auditorium-title" style="font-size: 22px; font-weight: 900; color: white; margin-top: 4px;"></h2>
          <p id="auditorium-sub" style="font-size: 13px; color: var(--text-muted); margin-top: 4px;"></p>
        </div>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-box" style="background: #ffffff; border: 1px solid #cbd5e1;"></div>
            <span style="color: #cbd5e1;">Available</span>
          </div>
          <div class="legend-item">
            <div class="legend-box" style="background: var(--emerald);"></div>
            <span style="color: #cbd5e1;">Selected</span>
          </div>
          <div class="legend-item">
            <div class="legend-box" style="background: var(--occupied-bg); border: 1px solid #334155; opacity: 0.6;"></div>
            <span style="color: #64748b;">Occupied</span>
          </div>
        </div>
      </div>

      <div id="status-message" class="status-alert"></div>

      <!-- AUDITORIUM GRID ROWS -->
      <div id="seat-rows" class="rows-container"></div>

      <!-- SCREEN ARC -->
      <div class="screen-container">
        <div class="screen-arc"></div>
        <div class="screen-label">All Eyes This Way — Screen</div>
      </div>
    </div>
  </div>

  <!-- DYNAMIC CHECKOUT BAR (BOTTOM PANEL) -->
  <div id="checkout-bar" class="checkout-bar">
    <div class="selected-summary">
      <span id="checkout-movie-title" style="font-size: 12px; font-weight: 800; color: #94a3b8; text-transform: uppercase;"></span>
      <div id="selected-seat-tags" class="seat-tags">
        <span style="font-size: 13px; color: #64748b; font-style: italic;">No seats selected</span>
      </div>
    </div>

    <div class="checkout-right">
      <div class="total-box">
        <div class="total-title">Total Amount</div>
        <div id="total-amount-display" class="total-value">₹0.00</div>
        <div id="calculation-detail" style="font-size: 11px; color: #64748b; margin-top: 2px;"></div>
      </div>

      <button id="confirm-btn" class="confirm-btn" disabled onclick="handleBooking()">
        Confirm Booking
      </button>
    </div>
  </div>

  <script>
    // Realistic 2026 Tamil Movie Catalog with INR Rates & Cast
    const moviesData = [
      {
        id: 'movie-1',
        title: 'Jana Nayagan',
        cast: 'Vijay, Pooja Hegde, Bobby Deol',
        rate: 250,
        genre: 'Political Action / Drama',
        duration: '168 mins',
        poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800&auto=format&fit=crop&q=80',
        theater: 'Sathyam Cinemas — Main Screen (Dolby Atmos 4K)'
      },
      {
        id: 'movie-2',
        title: 'Karuppu',
        cast: 'Suriya, Trisha, Yogi Babu',
        rate: 200,
        genre: 'Supernatural Action Thriller',
        duration: '162 mins',
        poster: 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&auto=format&fit=crop&q=80',
        theater: 'Sathyam Cinemas — Sathyam Studio'
      },
      {
        id: 'movie-3',
        title: 'Rajini: The Jailer 2',
        cast: 'Rajinikanth, Yogi Babu, Mohanlal',
        rate: 300,
        genre: 'Action Blockbuster',
        duration: '172 mins',
        poster: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&auto=format&fit=crop&q=80',
        theater: 'PVR Heritage RSL ECR — Screen 1 (IMAX Laser)'
      },
      {
        id: 'movie-4',
        title: 'Sardar 2',
        cast: 'Karthi, Malavika Mohanan',
        rate: 190,
        genre: 'Spy Thriller / Action',
        duration: '160 mins',
        poster: 'https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=800&auto=format&fit=crop&q=80',
        theater: 'AGS Cinemas T. Nagar — Screen 2 (Dolby Atmos)'
      }
    ];

    let selectedMovie = null;
    let selectedSeats = [];
    let seatStates = {}; // Map of "movie_id-seat_number" -> 'AVAILABLE' | 'BOOKED'

    // Initialize Mock Occupied Seats for real theater atmosphere
    function initOccupiedSeats() {
      moviesData.forEach(m => {
        ['C4', 'C5', 'C6', 'D5', 'D6'].forEach(seat => {
          seatStates[`${m.id}-${seat}`] = 'BOOKED';
        });
      });
    }

    // 1. Render Movie Catalog Grid
    function renderMovies() {
      const grid = document.getElementById('movies-grid');
      grid.innerHTML = '';

      moviesData.forEach(movie => {
        const card = document.createElement('div');
        card.className = `movie-card ${selectedMovie && selectedMovie.id === movie.id ? 'active' : ''}`;
        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${movie.poster}" alt="${movie.title}" />
            <div class="rate-badge">₹${movie.rate}</div>
          </div>
          <div class="movie-info">
            <h3>${movie.title}</h3>
            <p><strong>Cast:</strong> ${movie.cast}</p>
            <div class="movie-meta">
              <span>${movie.genre}</span>
              <span>${movie.duration}</span>
            </div>
          </div>
        `;
        card.onclick = () => selectMovie(movie);
        grid.appendChild(card);
      });
    }

    // 2. Select Movie & Open Auditorium Grid
    function selectMovie(movie) {
      selectedMovie = movie;
      selectedSeats = [];
      document.getElementById('status-message').className = 'status-alert';
      document.getElementById('status-message').textContent = '';

      renderMovies();
      renderAuditorium();
      updateCheckoutBar();
    }

    // 3. Render Auditorium Seats (Rows A-F, Columns 1-10)
    function renderAuditorium() {
      const box = document.getElementById('auditorium-box');
      box.style.display = 'block';

      document.getElementById('auditorium-title').textContent = `${selectedMovie.title} — ${selectedMovie.theater}`;
      document.getElementById('auditorium-sub').innerHTML = `Ticket Rate: <strong style="color: #f59e0b;">₹${selectedMovie.rate}.00</strong> / seat • Click available seats below`;

      const rowsContainer = document.getElementById('seat-rows');
      rowsContainer.innerHTML = '';

      const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
      rows.forEach(rowLabel => {
        const rowLine = document.createElement('div');
        rowLine.className = 'row-line';

        const leftLabel = document.createElement('span');
        leftLabel.className = 'row-label';
        leftLabel.textContent = rowLabel;
        rowLine.appendChild(leftLabel);

        const seatsGroup = document.createElement('div');
        seatsGroup.className = 'seats-group';

        for (let col = 1; col <= 10; col++) {
          const seatNum = `${rowLabel}${col}`;
          const status = seatStates[`${selectedMovie.id}-${seatNum}`] || 'AVAILABLE';
          const isSelected = selectedSeats.includes(seatNum);

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = col;

          let btnClass = 'seat-btn';
          if (status === 'BOOKED') {
            btnClass += ' occupied';
            btn.disabled = true;
            btn.title = `Seat ${seatNum} - Occupied`;
          } else if (isSelected) {
            btnClass += ' selected';
            btn.title = `Seat ${seatNum} - Selected`;
          } else {
            btn.title = `Seat ${seatNum} - Available (₹${selectedMovie.rate})`;
          }

          btn.className = btnClass;
          btn.onclick = () => toggleSeat(seatNum);

          seatsGroup.appendChild(btn);
        }

        rowLine.appendChild(seatsGroup);

        const rightLabel = document.createElement('span');
        rightLabel.className = 'row-label';
        rightLabel.textContent = rowLabel;
        rowLine.appendChild(rightLabel);

        rowsContainer.appendChild(rowLine);
      });
    }

    // 4. Toggle Seat Selection
    function toggleSeat(seatNum) {
      const idx = selectedSeats.indexOf(seatNum);
      if (idx > -1) {
        selectedSeats.splice(idx, 1);
      } else {
        if (selectedSeats.length >= 10) {
          alert('You can select up to 10 seats per booking.');
          return;
        }
        selectedSeats.push(seatNum);
      }
      renderAuditorium();
      updateCheckoutBar();
    }

    // 5. Update Dynamic Checkout Bar
    function updateCheckoutBar() {
      const bar = document.getElementById('checkout-bar');
      bar.style.display = 'flex';

      const titleEl = document.getElementById('checkout-movie-title');
      const tagsContainer = document.getElementById('selected-seat-tags');
      const totalDisplay = document.getElementById('total-amount-display');
      const detailEl = document.getElementById('calculation-detail');
      const confirmBtn = document.getElementById('confirm-btn');

      titleEl.textContent = `${selectedMovie.title} (${selectedSeats.length} Seats)`;

      if (selectedSeats.length === 0) {
        tagsContainer.innerHTML = '<span style="font-size: 13px; color: #64748b; font-style: italic;">No seats selected</span>';
        totalDisplay.textContent = '₹0.00';
        detailEl.textContent = '';
        confirmBtn.disabled = true;
        return;
      }

      tagsContainer.innerHTML = '';
      selectedSeats.forEach(seat => {
        const tag = document.createElement('span');
        tag.className = 'seat-tag';
        tag.textContent = seat;
        tagsContainer.appendChild(tag);
      });

      const total = selectedSeats.length * selectedMovie.rate;
      totalDisplay.textContent = `₹${total.toFixed(2)}`;
      detailEl.textContent = `(${selectedSeats.length} Seats × ₹${selectedMovie.rate}.00)`;
      confirmBtn.disabled = false;
    }

    // 6. Handle Booking (Simulates POST /api/bookings with Transaction & Row Lock Check)
    function handleBooking() {
      if (selectedSeats.length === 0) return;

      const statusEl = document.getElementById('status-message');
      const refCode = 'TN2026-' + Math.random().toString(36).substring(2, 8).toUpperCase();

      // Check if any seat was occupied concurrently
      let conflictSeat = null;
      selectedSeats.forEach(s => {
        if (seatStates[`${selectedMovie.id}-${s}`] === 'BOOKED') {
          conflictSeat = s;
        }
      });

      if (conflictSeat) {
        statusEl.className = 'status-alert error';
        statusEl.innerHTML = `⚠️ <strong>Seat already booked:</strong> Seat ${conflictSeat} was just booked by another user. Please choose another seat.`;
        return;
      }

      // Mark selected seats as BOOKED
      const bookedList = [...selectedSeats];
      bookedList.forEach(s => {
        seatStates[`${selectedMovie.id}-${s}`] = 'BOOKED';
      });

      selectedSeats = [];
      renderAuditorium();
      updateCheckoutBar();

      statusEl.className = 'status-alert success';
      statusEl.innerHTML = `🎉 <strong>Booking Confirmed!</strong> Booking Ref: <strong>${refCode}</strong>.<br/>Successfully booked seats: <strong>${bookedList.join(', ')}</strong> at ₹${(bookedList.length * selectedMovie.rate).toFixed(2)}.`;
    }

    // Boot the application
    initOccupiedSeats();
    renderMovies();
  </script>
</body>
</html>
